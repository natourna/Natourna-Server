name: Deploy

on:
  push:
    branches: [develop, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - id: target
        run: |
          echo "env=${{ github.ref_name == 'main' && 'prod' || 'dev' }}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./NatournaServer
          file: ./NatournaServer/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.target.outputs.owner }}/natourna-server:${{ steps.target.outputs.env }}
            ghcr.io/${{ steps.target.outputs.owner }}/natourna-server:${{ steps.target.outputs.env }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /srv/natourna/${{ steps.target.outputs.env }}
            docker compose pull server
            docker compose up -d
            docker image prune -f
